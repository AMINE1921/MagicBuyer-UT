    window.__mbTest = { searches: 0, bids: [], lists: [], captchaAt: 0, errorAt: 0 };
    var transferItems = [

    window.services = {
      Item: {
        clearTransferMarketCache: function () {},
        searchTransferMarket: function (criteria, page) {
          window.__mbTest.searches++;
          var n = window.__mbTest.searches;
          if (window.__mbTest.captchaAt && n >= window.__mbTest.captchaAt) { return later({ success: false, status: 458, error: { code: 458 } }); }
          if (criteria.defId && criteria.defId.length) {
            var did = criteria.defId[0];

            var price = Math.round((max * (0.9 + Math.random() * 0.1)) / 250) * 250;

          }
          if (n % 7 === 0) { items.push(makeItem({ bin: Math.round(max * 0.8 / 250) * 250, expires: 3598 })); }
          return later({ success: true, status: 200, data: { items: items } });
        },
        bid: function (item, price) {
          window.__mbTest.bids.push(price);
          var ok = Math.random() < 0.6 && coins >= price;

    window.repositories = { Item: {
      isPileFull: function () { return false; }, getPileSize: function () { return 100; }, numItemsInCache: function () { return transferItems.length; },

    // Contrôleur de recherche du marché (pour tester l'import "Sniper cette recherche")

      var crit = new UTSearchCriteriaDTO(); crit.type = "player"; crit.maskedDefId = 209331; crit.level = "gold"; crit.maxBuy = 31000;

    // ---- cartes (UTItemView) ----
    function cardItem(defId, name, rating, extra) {
      var it = makeItem({ definitionId: defId, name: name, rating: rating, state: "none", tradeId: "0" });
      it.isValid = function () { return true; }; it.isLimitedUse = function () { return false; }; it.concept = false;
      it.databaseId = defId & 0xffffff; it.tradable = true;
      return Object.assign(it, extra || {});

    function formation(name, displayName, names) { return { id: name, name: name, displayName: displayName, positions: names.map(function (n) { return { typeId: TYPE[n], typeName: n }; }), getPosition: function (i) { return this.positions[i] || null; } }; }
    var f442 = formation("f442", "4-4-2", ["GK", "RB", "CB", "CB", "LB", "RM", "CM", "CM", "LM", "ST", "ST"]);
    var f4334 = formation("f4334", "4-3-3 (4)", ["GK", "RB", "CB", "CB", "LB", "CM", "CM", "CAM", "RW", "ST", "LW"]);
    var currentFormation = f442;
    var slots = []; for (var si = 0; si < 23; si++) { (function (index) { slots.push({ index: index, _item: null, get item() { return this._item || { definitionId: 0 }; }, isValid: function () { return !!this._item; }, isBrick: function () { return false; }, get generalPosition() { return index < 11 ? currentFormation.positions[index].typeId : -1; } }); })(si); }
